<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets | IPL 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>IPL 2026 Ticket Booking</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="index.html#matches">Match Schedule</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Ticket Booking Form</h2>

            <form>
                <label for="customer-name">Full Name</label><br>
                <input type="text" id="customer-name" autocomplete="name"
                       minlength="2" maxlength="60" required><br><br>

                <label for="email">Email</label><br>
                <input type="email" id="email" autocomplete="email"
                       required><br><br>

                <label for="phone">Phone Number (10 digits)</label><br>
                <input type="tel" id="phone" autocomplete="tel"
                       inputmode="numeric" pattern="[0-9]{10}"
                       minlength="10" maxlength="10" required><br><br>

                <label for="match">Select Match</label><br>
                <select id="match" required>
                    <option value="" disabled selected>Select a match</option>
                    <option>RCB vs CSK</option>
                    <option>MI vs KKR</option>
                    <option>SRH vs RR</option>
                </select><br><br>

                <label for="stand">Stand Category</label><br>
                <select id="stand" required>
                    <option value="" disabled selected>Select a stand</option>
                    <option>General</option>
                    <option>Premium</option>
                    <option>VIP</option>
                </select><br><br>

                <label for="tickets">Number of Tickets (1–6)</label><br>
                <input type="number" id="tickets"
                       min="1" max="6" step="1" required><br><br>

                <article aria-labelledby="summary-title">
                    <h3 id="summary-title">Booking Summary</h3>
                    <p>Match: <span id="summary-match">Not Selected</span></p>
                    <p>Stand: <span id="summary-stand">Not Selected</span></p>
                    <p>Ticket Price: <span id="summary-price">₹0</span></p>
                    <p>Quantity: <span id="summary-quantity">0</span></p>
                    <p><strong>Total Amount: <span id="summary-total">₹0</span></strong></p>
                </article>

                <label>
                    <input type="checkbox" id="aisle-seat">
                    Prefer an aisle seat if available
                </label><br><br>

                <button type="submit">Book Now</button>
                <button type="reset">Reset</button>
            </form>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
